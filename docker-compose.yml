name: ${PROJECT_NAME}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:delegated
      - vendor_data:/var/www/html/vendor
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - laravel_network

  webserver:
    image: nginx:alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel_network

  db:
    # 1. تحديث نسخة قاعدة البيانات ضروري جداً
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DOCKER_DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    # إضافة هذا السطر لحل مشاكل التوثيق في MySQL 8 مع بعض الكلاينت القديمة
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - laravel_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT}:80"
    volumes:
      - ./docker/phpmyadmin.ini:/usr/local/etc/php/conf.d/phpmyadmin.ini
    depends_on:
      - db
    networks:
      - laravel_network

#   redis:
#     image: redis:latest
#     ports:
#         - "6379:6379"
#     networks:
#         - laravel_network
#     command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

networks:
  laravel_network:
    name: ${PROJECT_NAME}_network
    driver: bridge

volumes:
  db_data:
    name: ${PROJECT_NAME}_db_data
  vendor_data:
    name: ${PROJECT_NAME}_vendor_data
